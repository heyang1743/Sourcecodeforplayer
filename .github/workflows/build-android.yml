name: Android FFmpeg AV3A

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Android ABI to build
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - all
      build_programs:
        description: Build Android ffmpeg and ffprobe command-line binaries
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "0"
      enable_arc_video:
        description: Also enable bundled AVS2/AVS3 video decoders
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
  push:
    paths:
      - ".github/workflows/android-ffmpeg.yml"
      - "android_app/**"
      - "ffmpeg/ffmpeg-6.1/**"
      - "ffmpeg/dependency/android/**"
      - "ffmpeg/dependency/include/**"

jobs:
  build:
    name: Build FFmpeg for Android
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      NDK_VERSION: r20b
      NDK_DIR: ${{ github.workspace }}/.android-ndk/android-ndk-r20b
      ANDROID_NDK_HOME: ${{ github.workspace }}/.android-ndk/android-ndk-r20b
      BUILD_ABIS: ${{ github.event.inputs.abi || 'arm64-v8a' }}
      BUILD_PROGRAMS: ${{ github.event.inputs.build_programs || '1' }}
      ENABLE_ARC_VIDEO: ${{ github.event.inputs.enable_arc_video || '0' }}
      API: "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make build scripts executable
        shell: bash
        run: |
          while IFS= read -r script; do
            echo "chmod +x ${script}"
            chmod +x "${script}"
          done < <(find . -type f -name "*.sh" | sort)

          chmod +x ffmpeg/ffmpeg-6.1/configure

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl unzip pkg-config yasm nasm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK_DIR }}
          key: android-ndk-${{ env.NDK_VERSION }}-linux-x86_64

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$NDK_DIR")"
          curl -L "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux-x86_64.zip" -o /tmp/android-ndk.zip
          unzip -q /tmp/android-ndk.zip -d /tmp
          mv "/tmp/android-ndk-${NDK_VERSION}" "$NDK_DIR"

      - name: Build
        run: |
          cd ffmpeg/ffmpeg-6.1
          chmod +x ./build_android.sh
          ./build_android.sh

      - name: Prepare APK native libraries
        shell: bash
        run: |
          set -euo pipefail

          prepare_abi() {
            local ffmpeg_cpu="$1"
            local android_abi="$2"
            local src="ffmpeg/ffmpeg-6.1/android/${ffmpeg_cpu}"
            local prebuilt="android_app/prebuilt_jniLibs/${android_abi}"
            local dst="android_app/app/src/main/jniLibs/${android_abi}"

            if [[ -d "${prebuilt}" ]] && find "${prebuilt}" -maxdepth 1 -type f -name '*.so' -print -quit | grep -q .; then
              echo "Use prebuilt JNI libraries for ${android_abi}: ${prebuilt}"
              mkdir -p "${dst}"
              cp -Lf "${prebuilt}"/*.so "${dst}/"
              local cxx_shared="${ANDROID_NDK_HOME}/sources/cxx-stl/llvm-libc++/libs/${android_abi}/libc++_shared.so"
              if [[ -f "${cxx_shared}" ]]; then
                cp -Lf "${cxx_shared}" "${dst}/"
              fi
              return
            fi

            if [[ ! -d "${src}" ]]; then
              echo "Skip missing ABI output: ${src}"
              return
            fi

            mkdir -p "${dst}"
            cp -Lf "${src}"/lib/*.so "${dst}/"
            cp -Lf "${src}"/runtime/*.so "${dst}/"

            local cxx_shared="${ANDROID_NDK_HOME}/sources/cxx-stl/llvm-libc++/libs/${android_abi}/libc++_shared.so"
            if [[ -f "${cxx_shared}" ]]; then
              cp -Lf "${cxx_shared}" "${dst}/"
            fi
          }

          rm -rf android_app/app/src/main/jniLibs android_app/app/src/main/assets
          mkdir -p android_app/app/src/main/assets

          prepare_abi armv8-a arm64-v8a
          prepare_abi armv7-a armeabi-v7a

          cp -f ffmpeg/ffmpeg-6.1/model.bin android_app/app/src/main/assets/model.bin

          if [[ ! -d android_app/app/src/main/jniLibs ]] || [[ -z "$(find android_app/app/src/main/jniLibs -type f -name '*.so' -print -quit)" ]]; then
            echo "No native libraries were prepared for the APK." >&2
            exit 1
          fi

          echo "APK native libraries:"
          find android_app/app/src/main/jniLibs -type f | sort
          echo "APK assets:"
          find android_app/app/src/main/assets -type f | sort

      - name: Build APK
        run: |
          cd android_app
          gradle --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist/android
          cp -f android_app/app/build/outputs/apk/debug/app-debug.apk "dist/android/测试版2.apk"

      - name: Show artifact contents
        run: |
          cd ffmpeg/ffmpeg-6.1
          find android -maxdepth 4 -type f | sort
          tar -czf android-av3a-ffmpeg.tar.gz android
          cd ../..
          ls -l dist/android/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: av3a-player-apk-${{ env.BUILD_ABIS }}
          if-no-files-found: error
          path: dist/android/*.apk

      - name: Upload FFmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-av3a-ffmpeg-${{ env.BUILD_ABIS }}
          if-no-files-found: error
          path: |
            ffmpeg/ffmpeg-6.1/android
            ffmpeg/ffmpeg-6.1/android-av3a-ffmpeg.tar.gz
